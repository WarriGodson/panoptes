services:
  db:
    image: mysql:8.0
    container_name: panoptes-db
    environment:
      MYSQL_DATABASE: panoptes
      MYSQL_USER: panoptes
      MYSQL_PASSWORD: panoptes_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - panoptes-network
    restart: unless-stopped

  app:
    image: php:8.2-fpm
    container_name: panoptes-app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - panoptes-network
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=panoptes
      - DB_USERNAME=panoptes
      - DB_PASSWORD=panoptes_secret
    depends_on:
      - db
      - redis

  web:
    image: nginx:alpine
    container_name: panoptes-web
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - panoptes-network
    depends_on:
      - app

  queue:
    image: php:8.2-cli
    container_name: panoptes-queue
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: php artisan queue:work --sleep=3 --tries=3
    networks:
      - panoptes-network
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=panoptes
      - DB_USERNAME=panoptes
      - DB_PASSWORD=panoptes_secret
      - QUEUE_CONNECTION=database
  scheduler:
    image: php:8.2-cli
    container_name: panoptes-scheduler
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: php artisan schedule:work
    networks:
      - panoptes-network
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=panoptes
      - DB_USERNAME=panoptes
      - DB_PASSWORD=panoptes_secret
    depends_on:
      - app
      - db
    restart: unless-stopped
      - DB_CONNECTION=sqlite
  telegram-bot:
    image: php:8.2-cli
    container_name: panoptes-telegram-bot
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: php artisan bot:poll-telegram
    networks:
      - panoptes-network
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=panoptes
      - DB_USERNAME=panoptes
      - DB_PASSWORD=panoptes_secret
  redis:
    image: redis:alpine
    container_name: panoptes-redis
    ports:
      - "6379:6379"
    networks:
      - panoptes-network
    restart: unless-stopped

networks:
  panoptes-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
